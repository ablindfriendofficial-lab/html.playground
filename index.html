<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Audio Route Navigator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Audio Navigator</h1>
        <p>Rasta Record aur Trace Karein</p>
    </header>

    <main>
        <div class="status-card" aria-live="polite">
            <h2>Abhi Ki Sthiti</h2>
            <p id="status-text">Taiyar hai</p>
            
            <div id="stats-container" class="hidden">
                <div class="stat-box">
                    <span class="stat-label">Waypoints</span>
                    <span id="stat-waypoints" class="stat-value">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">Duri</span>
                    <span id="stat-distance" class="stat-value">0m</span>
                </div>
            </div>
        </div>

        <div id="visual-indicator" class="indicator-idle"></div>
    </main>

    <footer>
        <button id="btn-record" onclick="startRecording()" class="btn-blue">Recording Shuru Karein</button>
        <button id="btn-stop-record" onclick="stopRecording()" class="btn-red hidden">Recording Rokein</button>
        <button id="btn-trace" onclick="traceBack()" class="btn-green hidden">Wapas Trace Karein</button>
        <button id="btn-reset" onclick="resetApp()" class="btn-gray hidden">Reset Karein</button>
    </footer>

    <script src="script.js"></script>
</body>
</html>
